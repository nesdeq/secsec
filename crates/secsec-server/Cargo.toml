[package]
name = "secsec-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Blind server: the per-op authorization pipeline over the store, the authorized_keys gate, and the serve loop (secsec-Design.md §11, §12, §19)."

[lints]
workspace = true

[dependencies]
secsec-proto = { path = "../secsec-proto" }
secsec-store = { path = "../secsec-store" }
secsec-sig = { path = "../secsec-sig" }
secsec-frame = { path = "../secsec-frame" }
secsec-transport = { path = "../secsec-transport" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
getrandom = "0.3"
blake3 = "1"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
rcgen = "0.13"
