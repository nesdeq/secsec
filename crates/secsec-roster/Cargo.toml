[package]
name = "secsec-roster"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Roster sigchain: entries, fold/succession, per-entry AEAD, key histories (secsec-Design.md §8)."

[lints]
workspace = true

[features]
# Exposes the legacy v1 entry sealer for vector tooling; production never writes v1 entries.
legacy-v1 = []

[dependencies]
secsec-sig = { path = "../secsec-sig" }
secsec-frame = { path = "../secsec-frame" }
secsec-canon = { path = "../secsec-canon" }
secsec-aead = { path = "../secsec-aead" }
secsec-kdf = { path = "../secsec-kdf" }
blake3 = "1"
getrandom = "0.3"
zeroize = "1"

[dev-dependencies]
proptest.workspace = true
