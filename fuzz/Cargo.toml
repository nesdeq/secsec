# cargo-fuzz targets (nightly + libFuzzer), outside the root workspace; each wraps one `secsec_fuzz::fuzz_*` body.

# The empty workspace table keeps cargo from adopting this package into the root workspace.
[workspace]

[package]
name = "secsec-fuzz-targets"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
secsec-fuzz = { path = "../crates/secsec-fuzz" }

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false

[[bin]]
name = "roster_entry"
path = "fuzz_targets/roster_entry.rs"
test = false
doc = false

[[bin]]
name = "keyhist"
path = "fuzz_targets/keyhist.rs"
test = false
doc = false

[[bin]]
name = "keyslot"
path = "fuzz_targets/keyslot.rs"
test = false
doc = false

[[bin]]
name = "object"
path = "fuzz_targets/object.rs"
test = false
doc = false

[[bin]]
name = "head"
path = "fuzz_targets/head.rs"
test = false
doc = false

[[bin]]
name = "frontier"
path = "fuzz_targets/frontier.rs"
test = false
doc = false

[[bin]]
name = "tree"
path = "fuzz_targets/tree.rs"
test = false
doc = false

[[bin]]
name = "commit"
path = "fuzz_targets/commit.rs"
test = false
doc = false

[[bin]]
name = "pairing"
path = "fuzz_targets/pairing.rs"
test = false
doc = false
