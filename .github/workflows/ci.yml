name: ci

on:
  push:
    branches: ['**']   # branches only: tags run release.yml, which calls this workflow first
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo xtask vectors --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all --all-features

  # The declared rust-version must keep building.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check --locked --workspace --all-targets

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # Coverage-guided fuzzing, one minute per decoder (the stable corpus test runs in `test`).
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Run every target
        run: |
          set -eu
          for t in $(cargo fuzz list); do
            cargo fuzz run "$t" -- -max_total_time=60
          done

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -s sh install.sh ui/install.sh ui/macos/build.sh
      - name: GNOME extension parses
        run: |
          set -eu
          for f in ui/gnome/secsec@nesdeq.github.io/*.js; do
            cp "$f" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs"
          done

  menubar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh ui/macos/build.sh
